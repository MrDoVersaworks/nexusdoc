name: NexusDoc CI

on:
  push:
    branches: [main, audit-remediation]
  pull_request:
    branches: [main, audit-remediation]

jobs:
  backend:
    name: Backend — build and contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: './backend/package-lock.json'
      - run: npm ci
      - name: Type Check / Build
        run: npm run build
        env:
          JWT_ACCESS_SECRET: ci_access_secret_key_for_testing_purposes_only_32bytes
          JWT_REFRESH_SECRET: ci_refresh_secret_key_for_testing_purposes_only_32bytes
          AES_ENCRYPTION_KEY: ci_aes_key_32bytes_long_for_testing
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_db
          CORS_ORIGIN: http://localhost:3001
      - name: Contract tests
        run: npm test
      - name: Migration consistency
        run: npx drizzle-kit check:pg

  frontend:
    name: Frontend — lint, type check, and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: './frontend/package-lock.json'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type Check
        run: npx tsc --noEmit --skipLibCheck
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - name: Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Public Playwright smoke
        run: npm run test:e2e:smoke
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3001
